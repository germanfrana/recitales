<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recitales</title>
<meta name="description" content="Recitales en Buenos Aires, Córdoba y Santa Fe, reunidos de los portales de entradas.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎸</text></svg>">
<style>
:root{
  --bg:#f6f4ef; --panel:#ffffff; --tx:#1d1b18; --tx2:#6b665d; --line:#e4dfd4;
  --acc:#c2410c; --acc-tx:#ffffff; --chip:#efe9dd; --warn:#b45309; --ok:#15803d;
  --sombra:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#141311; --panel:#1e1c19; --tx:#f1ede6; --tx2:#a39d92; --line:#2f2c27;
    --acc:#fb923c; --acc-tx:#1a0f05; --chip:#2a2723; --warn:#fbbf24; --ok:#4ade80;
    --sombra:none;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);
  font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
header{padding:28px 0 8px}
h1{margin:0;font-size:clamp(26px,5vw,38px);letter-spacing:-.02em}
.sub{color:var(--tx2);margin:4px 0 0}
.filtros{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0;
  border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.buscar{flex:1 1 220px;min-width:0;padding:9px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel);color:var(--tx);font:inherit}
.grupo{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--tx);padding:6px 11px;
  border-radius:999px;font:inherit;font-size:13.5px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-tx)}
select.chip{appearance:auto}
.cuenta{color:var(--tx2);font-size:13.5px;margin:14px 0 4px}
.dia{margin:22px 0 8px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--tx2)}
.lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.ev{display:flex;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:10px;box-shadow:var(--sombra);min-width:0}
.ev img,.ev .sinimg{width:84px;height:84px;border-radius:10px;object-fit:cover;flex:none;background:var(--chip)}
.ev .sinimg{display:grid;place-items:center;font-size:30px}
.ev .cuerpo{min-width:0;flex:1}
.ev h3{margin:0 0 3px;font-size:15.5px;line-height:1.3;overflow-wrap:anywhere}
.ev .meta{color:var(--tx2);font-size:13px}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.links a{font-size:12.5px;text-decoration:none;background:var(--chip);border-radius:6px;padding:3px 8px}
.links a:hover{background:var(--acc);color:var(--acc-tx)}
.vacio{padding:40px 0;text-align:center;color:var(--tx2)}
footer{margin:40px 0 30px;padding-top:14px;border-top:1px solid var(--line);color:var(--tx2);font-size:13px}
footer ul{list-style:none;padding:0;margin:8px 0 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px}
.ok{color:var(--ok)} .mal{color:var(--warn)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Recitales 🎸</h1>
    <p class="sub">Buenos Aires, Córdoba y Santa Fe · reunidos de los portales de entradas · <span id="act">cargando…</span></p>
  </header>

  <div class="filtros">
    <input id="q" class="buscar" type="search" placeholder="Buscar artista, lugar o ciudad…" aria-label="Buscar">
    <div class="grupo" id="provs" role="group" aria-label="Provincia"></div>
    <div class="grupo" id="cuando" role="group" aria-label="Fecha"></div>
    <select id="portal" class="chip" aria-label="Portal"><option value="">Todos los portales</option></select>
  </div>

  <p class="cuenta" id="cuenta"></p>
  <main id="res"></main>

  <footer>
    <div>Los datos se actualizan solos dos veces por día. Precios y disponibilidad: siempre confirmar en el portal.</div>
    <ul id="estado"></ul>
  </footer>
</div>

<script>
const PROVS = ["Buenos Aires", "Córdoba", "Santa Fe"];
const CUANDO = [["7", "Esta semana"], ["30", "Este mes"], ["90", "3 meses"], ["", "Todo"]];
const st = { q: "", provs: new Set(PROVS), dias: "30", portal: "" };
let EVENTOS = [];

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = (s) => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const hoyISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const masDias = (n) => { const d = new Date(); d.setDate(d.getDate() + n); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };

function fechaLarga(iso) {
  const [a, m, d] = iso.slice(0, 10).split("-").map(Number);
  const f = new Date(a, m - 1, d);
  const t = f.toLocaleDateString("es-AR", { weekday: "long", day: "numeric", month: "long" });
  return t.charAt(0).toUpperCase() + t.slice(1);
}

function precio(p) {
  if (p == null || p === "" || +p === 0) return "";
  const n = Number(String(p).replace(/[^\d.,]/g, "").replace(/\.(?=\d{3}\b)/g, "").replace(",", "."));
  return " · " + (isFinite(n) && n > 0 ? "desde $ " + Math.round(n).toLocaleString("es-AR") : esc(p));
}

function chips() {
  $("#provs").innerHTML = PROVS.map(p =>
    `<button class="chip" data-p="${p}" aria-pressed="${st.provs.has(p)}">${p}</button>`).join("");
  $("#cuando").innerHTML = CUANDO.map(([v, t]) =>
    `<button class="chip" data-c="${v}" aria-pressed="${st.dias === v}">${t}</button>`).join("");
}

function filtrar() {
  const hoy = hoyISO();
  const hasta = st.dias ? masDias(+st.dias) : "9999";
  const q = norm(st.q).trim().split(/\s+/).filter(Boolean);
  return EVENTOS.filter(e => {
    const f = e.fecha.slice(0, 10);
    if (f < hoy || f > hasta) return false;
    if (!st.provs.has(e.provincia)) return false;
    if (st.portal && !e.enlaces.some(l => l.portal === st.portal)) return false;
    if (q.length) {
      const t = norm([e.titulo, e.lugar, e.ciudad, e.provincia, e.categoria].join(" "));
      if (!q.every(p => t.includes(p))) return false;
    }
    return true;
  });
}

function pintar() {
  const lista = filtrar();
  $("#cuenta").textContent = `${lista.length} ${lista.length === 1 ? "show" : "shows"}`;
  if (!lista.length) { $("#res").innerHTML = `<div class="vacio">No hay recitales con esos filtros.</div>`; return; }
  let html = "", dia = "";
  for (const e of lista) {
    const d = e.fecha.slice(0, 10);
    if (d !== dia) { if (dia) html += "</div>"; dia = d; html += `<h2 class="dia">${fechaLarga(d)}</h2><div class="lista">`; }
    const hora = e.fecha.length > 10 ? e.fecha.slice(11, 16) + " h · " : "";
    const donde = [e.lugar, e.ciudad && e.ciudad !== e.lugar ? e.ciudad : null, e.provincia].filter(Boolean).join(" · ");
    const img = e.imagen ? `<img src="${esc(e.imagen)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML='<div class=sinimg>🎵</div>'">` : `<div class="sinimg">🎵</div>`;
    const links = e.enlaces.map(l =>
      `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.portal)}${precio(l.precio)} ↗</a>`).join("");
    html += `<article class="ev">${img}<div class="cuerpo"><h3>${esc(e.titulo)}</h3>
      <div class="meta">${esc(hora)}${esc(donde)}</div><div class="links">${links}</div></div></article>`;
  }
  $("#res").innerHTML = html + "</div>";
}

function estado(data) {
  const g = new Date(data.generado);
  $("#act").textContent = "actualizado " + g.toLocaleString("es-AR", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
  const ps = Object.values(data.portales).sort((a, b) => a.portal.localeCompare(b.portal));
  $("#estado").innerHTML = ps.map(p => {
    const u = p.ultima_ok ? new Date(p.ultima_ok).toLocaleDateString("es-AR", { day: "numeric", month: "short" }) : "nunca";
    return p.ok
      ? `<li><span class="ok">●</span> ${esc(p.portal)}: ${p.cantidad}</li>`
      : `<li title="${esc(p.error)}"><span class="mal">●</span> ${esc(p.portal)}: sin leer desde ${u}</li>`;
  }).join("");
  const sel = $("#portal");
  for (const p of ps) sel.insertAdjacentHTML("beforeend", `<option>${esc(p.portal)}</option>`);
}

document.addEventListener("click", ev => {
  const b = ev.target.closest(".chip[data-p], .chip[data-c]");
  if (!b) return;
  if (b.dataset.p) {
    const p = b.dataset.p;
    if (st.provs.size === PROVS.length) { st.provs = new Set([p]); }      // primer clic: solo esa
    else if (st.provs.has(p)) { st.provs.delete(p); if (!st.provs.size) st.provs = new Set(PROVS); }
    else st.provs.add(p);
  } else st.dias = b.dataset.c;
  chips(); pintar();
});
$("#q").addEventListener("input", e => { st.q = e.target.value; pintar(); });
$("#portal").addEventListener("change", e => { st.portal = e.target.value; pintar(); });

chips();
fetch("eventos.json?t=" + Date.now())
  .then(r => r.json())
  .then(d => { EVENTOS = d.eventos; estado(d); pintar(); })
  .catch(() => { $("#act").textContent = "sin datos"; $("#res").innerHTML = `<div class="vacio">No se pudieron cargar los datos.</div>`; });
</script>
</body>
</html>
