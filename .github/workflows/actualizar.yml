name: Actualizar recitales

on:
  schedule:
    - cron: "0 9,21 * * *"   # 6 y 18 h de Argentina
  workflow_dispatch:          # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python actualizar.py

      - name: Guardar los datos nuevos
        run: |
          git config user.name "actualizador"
          git config user.email "actions@users.noreply.github.com"
          git add docs/eventos.json
          git diff --cached --quiet || git commit -m "Datos $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
